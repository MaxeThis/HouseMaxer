get:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    path:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 200
calib_start:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    prefix:
      required: false
      default: sensor.my_phone_ble_unfiltered_distance_to_
      selector:
        text:
    tick:
      required: false
      default: 1.0
      selector:
        number:
          min: 0.5
          max: 5
          step: 0.1
    max_minutes:
      required: false
      default: 180
      selector:
        number:
          min: 1
          max: 600
    scanners:
      required: false
      description: "Turns on the phone-fell-off watchdog (with xform). {scanner_key: [x_ft, y_ft, z_m]}"
      selector:
        object:
    xform:
      required: false
      description: "Robot map -> plan feet, from tracking/fit_robot_transform.py: {M: [[..],[..]], t: [..]}"
      selector:
        object:
    watchdog:
      required: false
      default: true
      selector:
        boolean:
    notify:
      required: false
      description: "notify service to also warn, e.g. mobile_app_my_phone"
      selector:
        text:
calib_stop:
  fields: {}
calib_runs:
  fields: {}
calib_get:
  fields:
    id:
      required: true
      selector:
        text:
